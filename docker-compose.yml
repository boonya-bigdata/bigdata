version: "3.9"

# ============================================================
# 大数据实战项目 - 一键本地开发环境
# 启动: docker-compose up -d
# 停止: docker-compose down -v
# ============================================================

services:
  # ==================== Hadoop HDFS ====================
  namenode:
    image: apache/hadoop:3.4.0
    hostname: namenode
    container_name: namenode
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "9870:9870"
      - "8020:8020"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/tmp/hadoop-root/dfs/name
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    user: root  # 添加这一行，使用 root 用户运行
    command:
      - bash
      - -c
      - |
        mkdir -p /tmp/hadoop-root/dfs/name
        chmod -R 755 /tmp/hadoop-root/dfs
        if [ ! -d "/tmp/hadoop-root/dfs/name/current" ]; then
          echo "Formatting NameNode for the first time..."
          hdfs namenode -format -force
        fi
        echo "Starting NameNode..."
        hdfs namenode
    networks:
      - bigdata-net

  datanode:
    image: apache/hadoop:3.4.0
    hostname: datanode
    container_name: datanode
    environment:
      - HDFS_DATANODE_DATA_DIR=/hadoop/datanode
    volumes:
      - hadoop_datanode:/hadoop/datanode  # 更改挂载路径
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    command: [ "hdfs", "datanode" ]
    user: root  # 临时使用root用户运行
    depends_on:
      - namenode
    networks:
      - bigdata-net

  resourcemanager:
    image: apache/hadoop:3.4.0
    hostname: resourcemanager
    container_name: resourcemanager
    ports:
      - "8088:8088"
    volumes:
      - ./config/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
      - datanode
    networks:
      - bigdata-net

  nodemanager:
    image: apache/hadoop:3.4.0
    hostname: nodemanager
    container_name: nodemanager
    volumes:
      - ./config/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - bigdata-net

  # ==================== Zookeeper + Kafka ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - bigdata-net

  # ==================== HBase ====================
  hbase:
    image: dajobe/hbase:latest
    hostname: hbase
    container_name: hbase
    ports:
      - "16010:16010"
      - "16000:16000"
    environment:
      HBASE_MANAGES_ZK: "false"
    depends_on:
      - namenode
      - datanode
      - zookeeper
    networks:
      - bigdata-net

  # ==================== MySQL + Hive Metastore ====================
  mysql:
    image: mysql:8.0
    hostname: mysql
    container_name: bigdata-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: hive123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - bigdata-net

  hive-metastore:
    image: apache/hive:4.0.0
    hostname: hive-metastore
    container_name: hive-metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      HIVE_METASTORE_DRIVER: com.mysql.cj.jdbc.Driver
      HIVE_METASTORE_HOST: hive-metastore
    depends_on:
      - namenode
      - mysql
    networks:
      - bigdata-net

  # ==================== Redis ====================
  redis:
    image: redis:7.2-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass admin --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bigdata-net

  # ==================== Flink ====================
  flink-jobmanager:
    image: flink:1.18.0-scala_2.12-java11
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    command: jobmanager  # 添加这一行
    networks:
      - bigdata-net

  flink-taskmanager:
    image: flink:1.18.0-scala_2.12-java11
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    command: jobmanager  # 添加这一行
    depends_on:
      - flink-jobmanager
    networks:
      - bigdata-net

  # ==================== Prometheus + Grafana ====================
  prometheus:
    image: prom/prometheus:v2.50.0
    hostname: prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bigdata-net

  grafana:
    image: grafana/grafana:10.3.0
    hostname: grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
    networks:
      - bigdata-net

volumes:
  hadoop_namenode:
  hadoop_datanode:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  bigdata-net:
    driver: bridge
